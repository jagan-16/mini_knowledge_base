services:


  postgres:
      image :  pgvector/pgvector:pg17
      container_name: rag_db
      restart : always

      environment :
          POSTGRES_USER: ${POSTGRES_USER}
          POSTGRES_PASSWORD : ${POSTGRES_PASSWORD}
          POSTGRES_DB :  ${POSTGRES_DB}
      
      healthcheck:
        test:
          [
            "CMD-SHELL",
            "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
          ]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 10s
      ports:
        - "5434:5432"

      
      volumes: 
            - postgres_data:/var/lib/postgresql/data




  fastapi:

      build: .

      container_name : Rag_app

      restart : always

      depends_on:
        postgres:
          condition: service_healthy

      ports:
       - "8000:8000"

      env_file:
        - .env
      command: >
        uvicorn main:app
        --host 0.0.0.0
        --port 8000
        --reload

      volumes: 
        - .:/app

  streamlit:
    build: .
    container_name: streamlit_app
    depends_on:
      - fastapi
    ports:
      - "8501:8501"
    command:   streamlit run frontend/streamlit_app.py --server.address=0.0.0.0 --server.port=8501

    volumes:
      - .:/app  


volumes:
    postgres_data:
   
    